<script>
const byId = id => document.getElementById(id);
const claim = byId('claim'), status = byId('status'), code = byId('code');
async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error('Request failed');
  return response.json();
}
function celebrate(origin) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const burst = byId('burst');
  const particles = document.createDocumentFragment();
  const colors = ['#ffcc69', '#fff0ba', '#ff6258', '#e9a144'];
  for (let i = 0; i < 28; i++) {
    const angle = i / 28 * Math.PI * 2;
    const distance = Math.min(innerWidth * .42, 235) * (.5 + Math.random() * .5);
    const spark = document.createElement('i');
    spark.className = 'spark';
    const values = {
      x: origin.left + origin.width / 2 + 'px',
      y: origin.top + origin.height / 2 + 'px',
      dx: Math.cos(angle) * distance + 'px',
      dy: Math.sin(angle) * distance + 'px',
      size: 3 + Math.random() * 4 + 'px',
      spin: (Math.random() - .5) * 700 + 'deg',
      color: colors[i % colors.length]
    };
    for (const [key, value] of Object.entries(values)) spark.style.setProperty('--' + key, value);
    particles.append(spark);
  }
  burst.replaceChildren(particles);
  setTimeout(() => burst.replaceChildren(), 900);
}
claim.onclick = async () => {
  claim.disabled = true;
  status.textContent = 'กำลังเปิดดูโค้ด…';
  try {
    const activity = await api('/api/event', visitorRequest('claim'));
    if (!activity.code) {
      status.textContent = 'ยังไม่มีโค้ดกิจกรรมในขณะนี้';
      claim.disabled = false;
      return;
    }
    const origin = claim.getBoundingClientRect();
    updateClaimCount(activity.claimed);
    code.textContent = activity.code;
    byId('details').textContent = activity.details;
    byId('details').hidden = !activity.details;
    byId('reveal').hidden = false;
    claim.setAttribute('aria-expanded', 'true');
    code.focus({preventScroll:true});
    claim.hidden = true;
    celebrate(origin);
    status.textContent = '';
  } catch {
    status.textContent = 'เปิดโค้ดไม่สำเร็จ ลองกดอีกครั้งได้ครับ';
    claim.disabled = false;
  }
};
byId('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(code.textContent);
    status.textContent = 'คัดลอกโค้ดแล้ว';
  } catch {
    const range = document.createRange();
    range.selectNodeContents(code);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    status.textContent = 'เลือกข้อความแล้ว ใช้คำสั่งคัดลอกของอุปกรณ์ได้เลย';
  }
};
let visitor = crypto.randomUUID();
try {
  visitor = localStorage.getItem('hotza-event-visitor') || visitor;
  localStorage.setItem('hotza-event-visitor', visitor);
} catch {}
function visitorRequest(action) {
  return {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({visitor, action})};
}
let displayedClaimCount = 0;
function updateClaimCount(count) {
  displayedClaimCount = Math.max(displayedClaimCount, count);
  byId('claimed').textContent = displayedClaimCount.toLocaleString('th-TH');
}
let updating = false;
async function heartbeat() {
  if (document.hidden || updating) return;
  updating = true;
  try {
    const {total, online, claimed} = await api('/api/event', visitorRequest('presence'));
    updateClaimCount(claimed);
    byId('total').textContent = total.toLocaleString('th-TH');
    byId('online').textContent = online.toLocaleString('th-TH');
  } catch {
    byId('total').textContent = byId('online').textContent = '—';
  } finally {
    updating = false;
  }
}
heartbeat();
setInterval(heartbeat, 15000);
document.addEventListener('visibilitychange', heartbeat);
